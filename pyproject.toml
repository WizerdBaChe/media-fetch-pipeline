[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-fetch-pipeline"
version = "2.0.3"
description = "Local media fetch pipeline: quality policy, fetch budget governor, naming/organizer, platform adapters."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "httpx>=0.27",
    "websockets>=13",
    # `mfp serve` (PSM Batch 2 §2). Loopback-only, unauthenticated by design
    # (O-3) -- see docs/psm-batch2-gui.md before exposing it anywhere else.
    "fastapi>=0.115",
    "uvicorn>=0.34",
    # `mfp stack`. The whole stacked-image path is ffmpeg for frames and
    # Pillow for pixels -- no OCR, no OpenCV, no numpy. That was measured,
    # not assumed (docs/spike-03, docs/spike-04), and it is why this line
    # adds ~3 MB to the packaged sidecar instead of ~150 MB.
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.scripts]
mfp = "mfp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A worker thread dying is a FAILURE, not a note in the warnings summary.
#
# `test_worker_lanes.py`'s fake adapter built a `FetchResult` without its two
# required fields, so every call raised inside `mfp-worker-transfer`. The
# worker's failure path caught it, the assertions read notes written before
# the return, and the suite stayed green -- for as long as the fixture
# existed. The only thing that ever said so was a warning that appeared in
# some runs and not others, because whether a dying thread is noticed depends
# on when it dies relative to teardown.
#
# Promoted here rather than fixed only at the site, because the site was
# never the point: a background thread is exactly where an exception has
# nobody to report to, and this suite runs several.
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["src/mfp"]
# `src/mfp/adapters/*` was omitted here while that package held nothing but
# the PlatformAdapter ABC, which was reasonable. It stopped being reasonable
# the moment M2/M3 landed chrome.py, cdp.py, extract.py, ytdlp.py and
# adapter.py inside it: the reported number went on saying 98% while a third
# of the newest code was not being measured at all. Same shape as P-4/P-6 --
# a green figure over something it does not look at.
omit = []

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    # An abstract method's body is a contract, not code that runs.
    "^\\s*\\.\\.\\.$",
    "@abstractmethod",
    "if TYPE_CHECKING:",
]
